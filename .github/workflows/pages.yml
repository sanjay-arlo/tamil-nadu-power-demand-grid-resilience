name: Build and deploy industry dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate or verify project dataset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,datetime,math
          from pathlib import Path
          p=Path('sample_tn_power_demand_outage_data.csv')
          if not p.exists():
              z=['North','Central','South','West','East']; h=['date','region','peak_demand_mw','available_capacity_mw','outage_incidents','field_staff_vacancy_rate']; s=datetime.date(2026,1,1)
              with p.open('w',newline='',encoding='utf-8') as f:
                  w=csv.writer(f); w.writerow(h)
                  for i in range(365):
                      peak=4200+[0,500,300,250,150][i%5]+60*math.sin(2*math.pi*i/365)+(i*17)%260; cap=4700+[300,100,500,350,450][i%5]+(i*7)%150; w.writerow([(s+datetime.timedelta(days=i)).isoformat(),z[i%5],round(peak,1),round(cap,1),2+(i*11)%12,18+(i*13)%29])
          PY
      - name: Build dashboard bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dashboard
          curl -fsSL https://raw.githubusercontent.com/sanjay-arlo/chennai-water-security-tanker-allocation/main/dashboard/index.html -o dashboard/index.html
          curl -fsSL https://raw.githubusercontent.com/sanjay-arlo/chennai-water-security-tanker-allocation/main/dashboard/app.js -o dashboard/app.js
          cp sample_tn_power_demand_outage_data.csv dashboard/data.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard sample_tn_power_demand_outage_data.csv
          if ! git diff --cached --quiet; then git commit -m 'feat: build industry dashboard and dataset [skip ci]'; git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dashboard}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
